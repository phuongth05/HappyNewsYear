experiment: B0_instructblip_image_only
seed: 2026

dataset:
  name: goodnews
  config: ../dataset/goodnews.example.yaml
  split: dev
  max_samples: 50
  subset_strategy: first_by_sample_id

model:
  type: instructblip
  name: Salesforce/instructblip-flan-t5-xl
  revision: bf9bd58cb3bb06e88c03b80f9cc346b90094bc6d
  device: auto
  dtype: float16
  batch_size: 1

prompt:
  instruction: "Describe the image in one factual news-style sentence."
  context_prefix: "Article context:\n"
  context_suffix: "\n\n"

# Present in B0 so the fairness validator can require an identical B1 policy.
context:
  max_context_tokens: 384
  truncation: head

generation:
  do_sample: false
  num_beams: 3
  max_new_tokens: 30
  min_new_tokens: 1
  no_repeat_ngram_size: 2
  length_penalty: 1.0
  early_stopping: true

output_dir: ../../runs/instructblip_goodnews_validation_50/b0

evaluation:
  enabled: true
  metrics: [cider, entity]
  allow_metric_errors: false
  entity_extractor: spacy
  spacy_model: en_core_web_sm
